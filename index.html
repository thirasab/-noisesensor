<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCG Cement Plant - Environmental Monitoring</title>
    <!-- โหลด MQTT Library ผ่าน CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <!-- Tailwind CSS สำหรับจัดแต่งหน้าเว็บ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* ทำให้รูปแผน่ายย่อ/ขยายตามขนาดจออัตโนมัติโดยรักษาสัดส่วน */
        .map-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 0.75rem;
        }
        /* ตำแหน่งจุดป้ายแสดงผลบนภาพ (ใช้ % ตามตำแหน่งจุดในแผนที่) */
        .sensor-badge {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center p-3 sm:p-6">

    <header class="mb-4 text-center">
        <h1 class="text-xl sm:text-2xl font-bold text-emerald-400">SCG Cement Mill - IoT Environmental Monitoring</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1" id="connection-status">Connecting to HiveMQ Cloud...</p>
    </header>

    <!-- ส่วนแสดงแผนที่โรงงาน (รองรับการย่อขยายบนมือถือ) -->
    <div class="map-wrapper shadow-2xl overflow-hidden border border-slate-700 rounded-xl mb-6">
        <div class="relative inline-block w-full">
            <img src="map-bg.jpg" alt="Plant Map" class="map-image">

            <!-- จุดที่ 1: Temp & Humidity (ID 1) -->
            <div class="sensor-badge bg-slate-900/95 border border-emerald-500 rounded-lg p-2 shadow-lg text-[10px] sm:text-xs" style="top: 75%; left: 27%;">
                <div class="font-bold text-emerald-300 border-b border-slate-700 pb-0.5 mb-0.5">📍 จุดที่ 1 (ENV)</div>
                <div>🌡️ <span id="val-temp">--</span> °C</div>
                <div>💧 <span id="val-hum">--</span> %RH</div>
            </div>

            <!-- จุดที่ 2: Noise 1 (ID 2) -->
            <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded-lg p-2 shadow-lg text-[10px] sm:text-xs" style="top: 57%; left: 38%;">
                <div class="font-bold text-blue-300 border-b border-slate-700 pb-0.5 mb-0.5">🔊 Noise 1</div>
                <div>📢 <span id="val-noise1">--</span> dB</div>
            </div>

            <!-- จุดที่ 3: Noise 2 (ID 3) -->
            <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded-lg p-2 shadow-lg text-[10px] sm:text-xs" style="top: 44%; left: 52%;">
                <div class="font-bold text-blue-300 border-b border-slate-700 pb-0.5 mb-0.5">🔊 Noise 2</div>
                <div>📢 <span id="val-noise2">--</span> dB</div>
            </div>

            <!-- จุดที่ 4: Noise 3 (ID 4) -->
            <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded-lg p-2 shadow-lg text-[10px] sm:text-xs" style="top: 19%; left: 63%;">
                <div class="font-bold text-blue-300 border-b border-slate-700 pb-0.5 mb-0.5">🔊 Noise 3</div>
                <div>📢 <span id="val-noise3">--</span> dB</div>
            </div>

            <!-- จุดที่ 5: Noise 4 (ID 5) -->
            <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded-lg p-2 shadow-lg text-[10px] sm:text-xs" style="top: 10%; left: 78%;">
                <div class="font-bold text-blue-300 border-b border-slate-700 pb-0.5 mb-0.5">🔊 Noise 4</div>
                <div>📢 <span id="val-noise4">--</span> dB</div>
            </div>
        </div>
    </div>

    <!-- แผงการ์ดสรุปค่าด้านล่าง (ออกแบบให้ Responsive แสดงผลสวยงามบนมือถือและจอคอม) -->
    <div class="w-full max-w-4xl grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 px-2">
        <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-3 text-center shadow">
            <div class="text-xs text-slate-400">อุณหภูมิ (Temp)</div>
            <div class="text-lg font-bold text-emerald-400 mt-1"><span id="card-temp">--</span> °C</div>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-3 text-center shadow">
            <div class="text-xs text-slate-400">ความชื้น (Humidity)</div>
            <div class="text-lg font-bold text-emerald-400 mt-1"><span id="card-hum">--</span> %RH</div>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-3 text-center shadow">
            <div class="text-xs text-slate-400">Noise 1 (ID 2)</div>
            <div class="text-lg font-bold text-blue-400 mt-1"><span id="card-noise1">--</span> dB</div>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-3 text-center shadow">
            <div class="text-xs text-slate-400">Noise 2 (ID 3)</div>
            <div class="text-lg font-bold text-blue-400 mt-1"><span id="card-noise2">--</span> dB</div>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-3 text-center shadow col-span-2 sm:col-span-1">
            <div class="text-xs text-slate-400">Noise 3 & 4</div>
            <div class="text-xs font-bold text-blue-300 mt-1"><span id="card-noise3">--</span> / <span id="card-noise4">--</span> dB</div>
        </div>
    </div>

    <script>
        const brokerUrl = 'wss://da20fee687434cce93e355ebceb7da00.s2.eu.hivemq.cloud:8884/mqtt';
        const topic = 'scg/cement/environment_monitoring';

        const options = {
            clientId: 'web_client_' + Math.random().toString(16).substring(2, 8),
            username: 'esp32_sensorMonitor', 
            password: 'Mcl195088', 
            clean: true
        };

        const client = mqtt.connect(brokerUrl, options);

        const statusEl = document.getElementById('connection-status');
        
        // Element บนแผนที่
        const tempEl = document.getElementById('val-temp');
        const humEl = document.getElementById('val-hum');
        const noise1El = document.getElementById('val-noise1');
        const noise2El = document.getElementById('val-noise2');
        const noise3El = document.getElementById('val-noise3');
        const noise4El = document.getElementById('val-noise4');

        // Element บนการ์ดสรุปด้านล่าง
        const cardTemp = document.getElementById('card-temp');
        const cardHum = document.getElementById('card-hum');
        const cardNoise1 = document.getElementById('card-noise1');
        const cardNoise2 = document.getElementById('card-noise2');
        const cardNoise3 = document.getElementById('card-noise3');
        const cardNoise4 = document.getElementById('card-noise4');

        client.on('connect', () => {
            statusEl.textContent = 'Status: Connected (Live Data)';
            statusEl.classList.remove('text-slate-400');
            statusEl.classList.add('text-emerald-400');
            client.subscribe(topic);
        });

        client.on('error', (err) => {
            statusEl.textContent = 'Connection Error: ' + err;
            statusEl.classList.add('text-red-400');
        });

        client.on('message', (t, payload) => {
            if (t === topic) {
                try {
                    const data = JSON.parse(payload.toString());
                    const tempValue = data.temperature !== undefined ? data.temperature : data.tenperature;
                    
                    if (tempValue !== undefined) {
                        tempEl.textContent = tempValue.toFixed(1);
                        cardTemp.textContent = tempValue.toFixed(1);
                    }
                    if (data.humidity !== undefined) {
                        humEl.textContent = data.humidity.toFixed(1);
                        cardHum.textContent = data.humidity.toFixed(1);
                    }
                    if (data.noise1 !== undefined) {
                        noise1El.textContent = data.noise1.toFixed(1);
                        cardNoise1.textContent = data.noise1.toFixed(1);
                    }
                    if (data.noise2 !== undefined) {
                        noise2El.textContent = data.noise2.toFixed(1);
                        cardNoise2.textContent = data.noise2.toFixed(1);
                    }
                    if (data.noise3 !== undefined) {
                        noise3El.textContent = data.noise3.toFixed(1);
                        cardNoise3.textContent = data.noise3.toFixed(1);
                    }
                    if (data.noise4 !== undefined) {
                        noise4El.textContent = data.noise4.toFixed(1);
                        cardNoise4.textContent = data.noise4.toFixed(1);
                    }
                } catch (e) {
                    console.error('Parse JSON error:', e);
                }
            }
        });
    </script>
</body>
</html>
