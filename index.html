<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCG Cement Plant - Environmental Monitoring</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .map-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 1000px;
        }
        .sensor-badge {
            position: absolute;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center p-2 md:p-4">

    <header class="mb-2 md:mb-4 text-center">
        <h1 class="text-lg md:text-2xl font-bold text-emerald-400">SCG Cement - IoT Monitoring</h1>
        <p class="text-xs md:text-sm text-slate-400" id="connection-status">Connecting to HiveMQ Cloud...</p>
    </header>

    <div class="map-container shadow-2xl rounded-xl overflow-hidden border border-slate-700">
        <img src="map-bg.jpg" alt="Plant Map" class="w-full h-auto block">

        <!-- จุดที่ 1 -->
        <div class="sensor-badge bg-slate-900/90 border border-emerald-500 rounded px-1.5 py-1 md:p-2 shadow-lg text-[10px] md:text-xs" style="top: 75%; left: 27%;">
            <div class="font-bold text-emerald-300 hidden md:block border-b border-slate-700 pb-0.5 mb-0.5">📍 จุดที่ 1 (CM)</div>
            <div>🌡️ <span id="val-t1">--</span>°C</div>
            <div>💧 <span id="val-h1">--</span>%</div>
            <div>📢 <span id="val-n1">--</span> dB</div>
        </div>

        <!-- จุดที่ 2 -->
        <div class="sensor-badge bg-slate-900/90 border border-blue-500 rounded px-1.5 py-1 md:p-2 shadow-lg text-[10px] md:text-xs" style="top: 57%; left: 38%;">
            <div class="font-bold text-blue-300 hidden md:block border-b border-slate-700 pb-0.5 mb-0.5">📍 จุดที่ 2 (CM)</div>
            <div>🌡️ <span id="val-t2">--</span>°C</div>
            <div>💧 <span id="val-h2">--</span>%</div>
            <div>📢 <span id="val-n2">--</span> dB</div>
        </div>

        <!-- จุดที่ 3 -->
        <div class="sensor-badge bg-slate-900/90 border border-amber-500 rounded px-1.5 py-1 md:p-2 shadow-lg text-[10px] md:text-xs" style="top: 44%; left: 52%;">
            <div class="font-bold text-amber-300 hidden md:block border-b border-slate-700 pb-0.5 mb-0.5">📍 จุดที่ 3 (CM)</div>
            <div>🌡️ <span id="val-t3">--</span>°C</div>
            <div>💧 <span id="val-h3">--</span>%</div>
            <div>📢 <span id="val-n3">--</span> dB</div>
        </div>

        <!-- จุดที่ 4 -->
        <div class="sensor-badge bg-slate-900/90 border border-purple-500 rounded px-1.5 py-1 md:p-2 shadow-lg text-[10px] md:text-xs" style="top: 19%; left: 63%;">
            <div class="font-bold text-purple-300 hidden md:block border-b border-slate-700 pb-0.5 mb-0.5">📍 จุดที่ 4 (CM)</div>
            <div>🌡️ <span id="val-t4">--</span>°C</div>
            <div>💧 <span id="val-h4">--</span>%</div>
            <div>📢 <span id="val-n4">--</span> dB</div>
        </div>

        <!-- จุดที่ 5 -->
        <div class="sensor-badge bg-slate-900/90 border border-rose-500 rounded px-1.5 py-1 md:p-2 shadow-lg text-[10px] md:text-xs" style="top: 10%; left: 78%;">
            <div class="font-bold text-rose-300 hidden md:block border-b border-slate-700 pb-0.5 mb-0.5">📍 จุดที่ 5 (CM)</div>
            <div>🌡️ <span id="val-t5">--</span>°C</div>
            <div>💧 <span id="val-h5">--</span>%</div>
            <div>📢 <span id="val-n5">--</span> dB</div>
        </div>
    </div>

    <script>
        const brokerUrl = 'wss://da20fee687434cce93e355ebceb7da00.s2.eu.hivemq.cloud:8884/mqtt';
        const topic = 'scg/cement/environment_monitoring';

        const options = {
            clientId: 'web_client_' + Math.random().toString(16).substring(2, 8),
            username: 'esp32_sensorMonitor', 
            password: 'Mcl195088', 
            clean: true
        };

        const client = mqtt.connect(brokerUrl, options);
        const statusEl = document.getElementById('connection-status');

        client.on('connect', () => {
            statusEl.textContent = 'Status: Connected';
            statusEl.className = 'text-xs md:text-sm text-emerald-400';
            client.subscribe(topic);
        });

        client.on('error', (err) => {
            statusEl.textContent = 'Error: ' + err;
            statusEl.className = 'text-xs md:text-sm text-red-400';
        });

        client.on('message', (t, payload) => {
            if (t === topic) {
                try {
                    const data = JSON.parse(payload.toString());
                    
                    // อัพเดตค่าทั้ง 5 จุด
                    for(let i = 1; i <= 5; i++) {
                        if (data['t'+i] !== undefined) document.getElementById('val-t'+i).textContent = data['t'+i].toFixed(1);
                        if (data['h'+i] !== undefined) document.getElementById('val-h'+i).textContent = data['h'+i].toFixed(1);
                        if (data['n'+i] !== undefined) document.getElementById('val-n'+i).textContent = data['n'+i].toFixed(1);
                    }
                } catch (e) {
                    console.error('Parse JSON error:', e);
                }
            }
        });
    </script>
</body>
</html>
