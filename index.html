<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCG Cement Plant - Environmental Monitoring</title>
    <!-- โหลด MQTT Library ผ่าน CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <!-- Tailwind CSS สำหรับจัดแต่งหน้าเว็บ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* แจ้งเตือนบังคับแนวนอนเฉพาะหน้าจอมือถือแนวตั้ง */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 23, 42, 0.98);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* ถ้าเปิดบนมือถือ และอยู่ในแนวตั้ง (portrait) ให้แสดงหน้าต่างเตือนนี้ */
        @media screen and (max-width: 1024px) and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }

        .map-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 900px;
        }
        .sensor-badge {
            position: absolute;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-2">

    <!-- หน้าต่างบังคับให้หมุนจอ -->
    <div id="orientation-warning">
        <div class="text-5xl mb-4 animate-bounce">📱🔄</div>
        <h2 class="text-xl font-bold text-emerald-400 mb-2">กรุณาหมุนโทรศัพท์เป็นแนวนอน</h2>
        <p class="text-sm text-slate-300">เพื่อการแสดงผลแผนที่และค่าเซนเซอร์ที่ชัดเจนเต็มตา</p>
    </div>

    <header class="mb-2 text-center">
        <h1 class="text-lg md:text-xl font-bold text-emerald-400">SCG Cement - IoT Monitoring</h1>
        <p class="text-xs text-slate-400" id="connection-status">Connecting to HiveMQ Cloud...</p>
    </header>

    <!-- พื้นหลังแผนที่โรงงาน -->
    <div class="map-container shadow-2xl rounded-xl overflow-hidden border border-slate-700">
        <img src="map-bg.jpg" alt="Plant Map" class="w-full h-auto block">

        <!-- จุดที่ 1: Temp & Humidity (ID 1) -->
        <div class="sensor-badge bg-slate-900/95 border border-emerald-500 rounded px-1.5 py-0.5 shadow-lg text-[10px] md:text-xs" style="top: 75%; left: 27%;">
            <div>🌡️ <span id="val-temp">--</span>°C</div>
            <div>💧 <span id="val-hum">--</span>%</div>
        </div>

        <!-- จุดที่ 2: Noise 1 (ID 2) -->
        <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded px-1.5 py-0.5 shadow-lg text-[10px] md:text-xs" style="top: 57%; left: 38%;">
            <div>🔊 N1: <span id="val-noise1">--</span> dB</div>
        </div>

        <!-- จุดที่ 3: Noise 2 (ID 3) -->
        <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded px-1.5 py-0.5 shadow-lg text-[10px] md:text-xs" style="top: 44%; left: 52%;">
            <div>🔊 N2: <span id="val-noise2">--</span> dB</div>
        </div>

        <!-- จุดที่ 4: Noise 3 (ID 4) -->
        <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded px-1.5 py-0.5 shadow-lg text-[10px] md:text-xs" style="top: 19%; left: 63%;">
            <div>🔊 N3: <span id="val-noise3">--</span> dB</div>
        </div>

        <!-- จุดที่ 5: Noise 4 (ID 5) -->
        <div class="sensor-badge bg-slate-900/95 border border-blue-500 rounded px-1.5 py-0.5 shadow-lg text-[10px] md:text-xs" style="top: 10%; left: 78%;">
            <div>🔊 N4: <span id="val-noise4">--</span> dB</div>
        </div>
    </div>

    <script>
        const brokerUrl = 'wss://da20fee687434cce93e355ebceb7da00.s2.eu.hivemq.cloud:8884/mqtt';
        const topic = 'scg/cement/environment_monitoring';

        const options = {
            clientId: 'web_client_' + Math.random().toString(16).substring(2, 8),
            username: 'esp32_sensorMonitor', 
            password: 'Mcl195088', 
            clean: true
        };

        const client = mqtt.connect(brokerUrl, options);

        const statusEl = document.getElementById('connection-status');
        const tempEl = document.getElementById('val-temp');
        const humEl = document.getElementById('val-hum');
        const noise1El = document.getElementById('val-noise1');
        const noise2El = document.getElementById('val-noise2');
        const noise3El = document.getElementById('val-noise3');
        const noise4El = document.getElementById('val-noise4');

        client.on('connect', () => {
            statusEl.textContent = 'Status: Connected';
            statusEl.classList.remove('text-slate-400');
            statusEl.classList.add('text-emerald-400');
            client.subscribe(topic);
        });

        client.on('error', (err) => {
            statusEl.textContent = 'Error: ' + err;
            statusEl.classList.add('text-red-400');
        });

        client.on('message', (t, payload) => {
            if (t === topic) {
                try {
                    const data = JSON.parse(payload.toString());
                    const tempValue = data.temperature !== undefined ? data.temperature : data.tenperature;
                    
                    if (tempValue !== undefined) tempEl.textContent = tempValue.toFixed(1);
                    if (data.humidity !== undefined) humEl.textContent = data.humidity.toFixed(1);
                    if (data.noise1 !== undefined) noise1El.textContent = data.noise1.toFixed(1);
                    if (data.noise2 !== undefined) noise2El.textContent = data.noise2.toFixed(1);
                    if (data.noise3 !== undefined) noise3El.textContent = data.noise3.toFixed(1);
                    if (data.noise4 !== undefined) noise4El.textContent = data.noise4.toFixed(1);
                } catch (e) {
                    console.error('Parse JSON error:', e);
                }
            }
        });
    </script>
</body>
</html>
